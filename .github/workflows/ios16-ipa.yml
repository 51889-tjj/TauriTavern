name: Build iOS 16 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare iOS project
        run: pnpm run ios:build -- --no-sign || true

      - name: Build unsigned iOS application
        run: |
          xcodebuild \
            -project src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj \
            -scheme tauritavern_iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/tauri-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package unsigned IPA for TrollStore
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find "$RUNNER_TEMP/tauri-derived" -type d -name 'TauriTavern.app' -print -quit)
          test -n "$app_path"
          mkdir -p package/Payload
          cp -R "$app_path" package/Payload/TauriTavern.app
          (cd package && zip -qry ../TauriTavern-ios16-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-ios16-unsigned
          path: TauriTavern-ios16-unsigned.ipa
          if-no-files-found: error
